name: ari-governance
version: "0.1.0"
description: "Gate money-moving Hermes tool calls through the ARI governance kernel before they execute, and commit actual spend on success. The kernel owns spend caps, kill switches, tenant isolation and the audit trail; this plugin is the seam. pre_tool_call fails CLOSED — an unreachable money gate blocks the tool rather than letting spend through."
author: "FORGE"
provides_hooks:
  - pre_tool_call
  - post_tool_call
